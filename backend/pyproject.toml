[project]
name = "dosetrack-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.43,<3",
  "psycopg[binary]>=3.2.9,<4",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.10,<3",
  "argon2-cffi>=25.1,<26",
  "python-multipart>=0.0.20,<1",
  "filetype>=1.2,<2",
  "pillow>=11.3,<12",
  "pillow-heif>=1.1,<2",
  "aiogram>=3.22,<4",
  "httpx>=0.28,<1",
  "pyotp>=2.9,<3",
  "email-validator>=2.2,<3",
  "openpyxl>=3.1,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-cov>=6.2,<7", "ruff>=0.12,<1", "mypy>=1.17,<2", "types-openpyxl>=3.1,<4"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]
